
name: RaceDay CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test RaceDay
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.Part2.sln

      - name: Build solution
        run: dotnet build RaceDay.Part2.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RaceDay.Part2.sln --configuration Release --no-build
